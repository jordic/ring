name: Ring
options:
  bundleIdPrefix: com.ring
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  swift: "6.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ring.app
    PRODUCT_NAME: Ring
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Ring:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ring.app
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_NSHumanReadableDescription: Local OAuth & credential manager for macOS
        CODE_SIGN_ENTITLEMENTS: Sources/Ring.entitlements
        CODE_SIGN_STYLE: Automatic
        ARCHS: "arm64 x86_64"
    entitlements:
      path: Sources/Ring.entitlements
      properties:
        com.apple.security.app-sandbox: false
        keychain-access-groups:
          - com.ring.tokenstore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Ring
        CFBundleDisplayName: Ring
        CFBundleIdentifier: com.ring.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ring.oauth
            CFBundleURLSchemes:
              - ring
        LSMinimumSystemVersion: "14.0"
